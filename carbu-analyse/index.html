// ── CONFIGURATIE ──────────────────────────────────────────────────────────────

  peakVermogen:    0.30,  // 30% piekzermogen (HP)

let sb = null;

let motorenCache = {};
let combinaties = {};     // { motorNr: { carbu: [ {sessie, run} ] } }
let alleScores = null;    // genormaliseerde scores na berekening
let huidigView = 'overzicht';
let gekozenMotor = null;

// ── HELPERS ───────────────────────────────────────────────────────────────────
const esc = s => String(s??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
const f1 = v => (v??0).toFixed(1);
const f2 = v => (v??0).toFixed(2);
const fRpm = v => v ? Math.round(v).toLocaleString('nl-NL') : '—';
const motorLabel = mn => {
  const c = motorenCache[mn];

  return naam || mn || '?';
};

function toggleNav(){document.getElementById('nav-dropdown').classList.toggle('open');}

// ── SUPABASE: DATA LADEN ──────────────────────────────────────────────────────
function fromRow(r){
  return {
    id:r.id, motorNummer:r.motor_nummer||'', klant:r.klant||'',
    carbu:r.carbu||'', testType:r.test_type||'Test', uitkomst:r.uitkomst||'',
    opmerkingen:r.opmerkingen||'', runs:r.runs||[],
    motorMerk:r.motor_merk||'', motorType:r.motor_type||'', motorNaam:r.motor_naam||'',
    created_at:r.created_at||''
  };
}

async function laadCarbuLijstDB(){
  try{
    const {data} = await sb.from('carburatoren').select('*').order('naam');
    carbuLijstDB = (data||[]).map(r=>({
      id:r.id, naam:r.naam||'', motorType:r.motor_type||'', merk:r.merk||'', model:r.model||'',
      baanHoog:r.baan_hoog||'', baanLaag:r.baan_laag||'', testHoog:r.test_hoog||'', testLaag:r.test_laag||'', opmerkingen:r.opmerkingen||''
    }));
  }catch{ carbuLijstDB=[]; }
}

// Geeft alle bekende carbu-namen terug: unie van Supabase carburatoren + sessiedata
function alleCarbuNamen(){
  const set = new Set(carbuLijstDB.map(c=>c.naam).filter(Boolean));
  Object.values(combinaties).forEach(cm=>Object.keys(cm).forEach(c=>set.add(c)));
  return [...set].sort((a,b)=>a.localeCompare(b,'nl',{sensitivity:'base'}));
}

async function syncCarbuNamenNaarDB(){
  const namen = new Set();
  sessies.forEach(s=>{
    if(s.carbu?.trim()) namen.add(s.carbu.trim());
    (s.runs||[]).forEach(r=>{ if(r.carbu?.trim()) namen.add(r.carbu.trim()); });
  });
  const bestaand = new Set(carbuLijstDB.map(c=>c.naam));
  const nieuw = [...namen].filter(n=>!bestaand.has(n));
  if(!nieuw.length) return;
  const records = nieuw.map(naam=>({
    id: (crypto.randomUUID ? crypto.randomUUID() : ([1e7]+-1e3+-4e3+-8e3+-1e11).replace(/[018]/g,c=>(c^crypto.getRandomValues(new Uint8Array(1))[0]&15>>c/4).toString(16))),
    naam, motor_type:'', merk:'', model:'', baan_hoog:'', baan_laag:'', test_hoog:'', test_laag:'', opmerkingen:''
  }));
  await sb.from('carburatoren').upsert(records,{onConflict:'id'});
  await laadCarbuLijstDB();
}

async function laadData(){
  document.getElementById('db-status').innerHTML='<span class="db-dot" style="background:#10b981"></span>Supabase';
  const [{data:sd},{data:md}] = await Promise.all([
    sb.from('sessies').select('*').order('created_at',{ascending:false}),
    sb.from('motoren').select('*')
  ]);
  await laadCarbuLijstDB();
  sessies = (sd||[]).map(fromRow);
  motorenCache = {};
  (md||[]).forEach(r=>{motorenCache[r.motor_nummer]=r;});
  await syncCarbuNamenNaarDB();
  verwerkCombinaties();
  berekenAlleScores();
  render();
}

// ── CARBU HERNOEMEN ───────────────────────────────────────────────────────────
async function hernoemCarbu(oudeNaam){
  const nieuweNaam = prompt(`Nieuwe naam voor "${oudeNaam}":`, oudeNaam);
  if(!nieuweNaam||nieuweNaam.trim()===oudeNaam) return;
  const nieuw = nieuweNaam.trim();

  // 1. Update naam in Supabase carburatoren tabel
  const dbCarbu = carbuLijstDB.find(c=>c.naam===oudeNaam);
  if(dbCarbu) await sb.from('carburatoren').update({naam:nieuw,updated_at:new Date().toISOString()}).eq('id',dbCarbu.id);

  // 2. Update alle Supabase sessies die deze carbu bevatten
  if(sb){
    const teUpdaten = sessies.filter(s=>
      s.carbu===oudeNaam || (s.runs||[]).some(r=>r.carbu===oudeNaam)
    );
    for(const s of teUpdaten){
      const nieuweRuns = (s.runs||[]).map(r=>r.carbu===oudeNaam ? {...r, carbu:nieuw} : r);
      await sb.from('sessies').update({
        carbu: s.carbu===oudeNaam ? nieuw : s.carbu,
        runs: nieuweRuns
      }).eq('id', s.id);
    }
  }

  // 3. Herlaad data
  await laadData();
  gekozenCarbu = nieuw;
  render();
}

// ── DATA VERWERKING ───────────────────────────────────────────────────────────
function effectiefCarbu(sessie, run){
  return (run.carbu||'').trim() || (sessie.carbu||'').trim() || '';
}

function verwerkCombinaties(){
  combinaties = {};
  sessies.forEach(sessie=>{
    const mn = sessie.motorNummer;
    if(!mn) return;
    (sessie.runs||[]).forEach(run=>{
      if(!run.curveData||!run.curveData.length) return;
      const carbu = effectiefCarbu(sessie, run);
      if(!carbu) return;
      if(!combinaties[mn]) combinaties[mn]={};
      if(!combinaties[mn][carbu]) combinaties[mn][carbu]=[];
      combinaties[mn][carbu].push({sessie, run});
    });
  });
}

// ── ANALYSE FUNCTIES ──────────────────────────────────────────────────────────
function interpoleer(curve, rpm){
  if(!curve||!curve.length) return null;
  if(rpm<=curve[0].rpm) return null; // niet buiten gemeten bereik
  if(rpm>=curve[curve.length-1].rpm) return null;
  for(let i=0;i<curve.length-1;i++){
    if(rpm>=curve[i].rpm&&rpm<=curve[i+1].rpm){
      const t=(rpm-curve[i].rpm)/(curve[i+1].rpm-curve[i].rpm);
      return {
        hp: curve[i].hp+t*(curve[i+1].hp-curve[i].hp),
        nm: curve[i].nm+t*(curve[i+1].nm-curve[i].nm)
      };
    }
  }
  return null;
}

function interpoleerHp(curve, rpm){
  const r = interpoleer(curve, rpm);
  return r ? r.hp : null;
}

function normaliseerCurve(curve){
  // Oude data heeft HP in Watts — zelfde fix als tekenLijnChart in analyse/index.html
  const maxHpRaw = Math.max(...curve.map(p=>p.hp));
  if(maxHpRaw > 100){
    return curve.map(p=>({...p, hp: p.hp/745.7}));
  }
  return curve;
}

function analyseRun(run){
  const rawCurve = run.curveData||[];
  if(!rawCurve.length) return null;
  const curve = normaliseerCurve(rawCurve);
  const sorted = [...curve].sort((a,b)=>a.rpm-b.rpm);
  const minRpm = sorted[0].rpm;
  const maxRpm = sorted[sorted.length-1].rpm;

  // Piek HP: gebruik gecorrigeerde scalaire waarde van de run indien aanwezig
  let peakHpRpm=0;
  let peakHpCurve=0;
  sorted.forEach(p=>{if(p.hp>peakHpCurve){peakHpCurve=p.hp;peakHpRpm=p.rpm;}});
  const peakHp = (run.vermogen && run.vermogen>0 && run.vermogen<100)
    ? run.vermogen : peakHpCurve;
  if(run.vermogenRpm) peakHpRpm = run.vermogenRpm;

  // Piek Nm: gebruik gecorrigeerde scalaire waarde van de run indien aanwezig
  let peakNmRpm=0;
  let peakNmCurve=0;
  sorted.forEach(p=>{if(p.nm>peakNmCurve){peakNmCurve=p.nm;peakNmRpm=p.rpm;}});
  const peakNm = (run.koppel && run.koppel>0 && run.koppel<100)
    ? run.koppel : peakNmCurve;
  if(run.koppelRpm) peakNmRpm = run.koppelRpm;

  // HP bij vaste RPM-punten
  const hpBijRpm={};
  RPM_PUNTEN.forEach(rpm=>{
    if(rpm>=minRpm&&rpm<=maxRpm){
      const v=interpoleerHp(sorted,rpm);
      if(v!==null) hpBijRpm[rpm]=v;
    }
  });

  // Gemiddelde HP in middengebied (9000-11500)
  const midPunten=sorted.filter(p=>p.rpm>=RPM_MIDDEN_MIN&&p.rpm<=RPM_MIDDEN_MAX);
  const gemHpMidden=midPunten.length ? midPunten.reduce((s,p)=>s+p.hp,0)/midPunten.length : null;
  const gemNmMidden=midPunten.length ? midPunten.reduce((s,p)=>s+p.nm,0)/midPunten.length : null;

  // Gemiddelde HP in bovengebied (11500-14000)
  const topPunten=sorted.filter(p=>p.rpm>=RPM_TOP_MIN&&p.rpm<=RPM_TOP_MAX);
  const gemHpTop=topPunten.length ? topPunten.reduce((s,p)=>s+p.hp,0)/topPunten.length : null;

  // Oppervlakte onder de curve (8000-14000 rpm, trapeziumregel)
  let area=0;
  for(let i=1;i<sorted.length;i++){
    const r1=sorted[i-1].rpm, r2=sorted[i].rpm;
    if(r2>=RPM_BEREIK_MIN&&r1<=RPM_BEREIK_MAX){
      area+=(r2-r1)*(sorted[i-1].hp+sorted[i].hp)/2;
    }
  }

  // Powerbandbreedgte: RPM-bereik waar HP >= 95% van piek
  const drempelHp=peakHp*POWERBAND_DREMPEL;
  const bandPunten=sorted.filter(p=>p.hp>=drempelHp);
  const powerbandBreedte=bandPunten.length>=2
    ? bandPunten[bandPunten.length-1].rpm-bandPunten[0].rpm : 0;

  // Curve kwaliteit: vloeiendheid (stabiele stijging dan daling, weinig spikes)
  // Bereken HP-verandering per 100 rpm tussen opeenvolgende punten
  const deltas=[];
  for(let i=1;i<sorted.length;i++){
    const dr=sorted[i].rpm-sorted[i-1].rpm;
    if(dr>0&&dr<600) deltas.push((sorted[i].hp-sorted[i-1].hp)/dr*100);
  }
  let curveKwaliteit=1.0;
  if(deltas.length>2){
    const gem=deltas.reduce((s,d)=>s+d,0)/deltas.length;
    const stddev=Math.sqrt(deltas.reduce((s,d)=>s+Math.pow(d-gem,2),0)/deltas.length);
    // Lage stddev = vloeiende curve. Normaliseer: stddev < 2 = goed
    curveKwaliteit=Math.max(0, Math.min(1, 1 - stddev/15));
  }

  return {
    peakHp, peakHpRpm, peakNm, peakNmRpm,
    gemHpMidden, gemHpTop, gemNmMidden,
    area, powerbandBreedte, curveKwaliteit,
    hpBijRpm, minRpm, maxRpm
  };
}

// Kies de beste run voor een combinatie (isBest vlag, anders hoogste HP)
function besteRunVan(runItems){
  if(!runItems||!runItems.length) return null;
  const geldig = runItems.filter(ri=>ri.run.curveData&&ri.run.curveData.length);
  if(!geldig.length) return null;
  const metVlag = geldig.find(ri=>ri.run.isBest);
  if(metVlag) return metVlag;
  return geldig.reduce((best,ri)=>
    (ri.run.vermogen||0)>(best.run.vermogen||0)?ri:best, geldig[0]);
}

// Analyseer een motor × carbu combinatie (met meerdere runs)
function analyseCombi(runItems){
  if(!runItems||!runItems.length) return null;
  const geldig = runItems.filter(ri=>ri.run.curveData&&ri.run.curveData.length);
  if(!geldig.length) return null;

  const beste = besteRunVan(runItems);
  const besteAnalyse = analyseRun(beste.run);
  if(!besteAnalyse) return null;

  // Gemiddelde over alle geldige runs
  const analyses = geldig.map(ri=>analyseRun(ri.run)).filter(Boolean);
  const gemAnalyse = {
    peakHp: analyses.reduce((s,a)=>s+a.peakHp,0)/analyses.length,
    peakNm: analyses.reduce((s,a)=>s+a.peakNm,0)/analyses.length,
    gemHpMidden: analyses.reduce((s,a)=>s+(a.gemHpMidden||0),0)/analyses.length,
    gemHpTop: analyses.reduce((s,a)=>s+(a.gemHpTop||0),0)/analyses.length,
    gemNmMidden: analyses.reduce((s,a)=>s+(a.gemNmMidden||0),0)/analyses.length,
    powerbandBreedte: analyses.reduce((s,a)=>s+a.powerbandBreedte,0)/analyses.length,
    curveKwaliteit: analyses.reduce((s,a)=>s+a.curveKwaliteit,0)/analyses.length,
  };

  // Consistentie tussen runs (stddev peakHp t.o.v. gemiddelde)
  const hpWaarden = analyses.map(a=>a.peakHp);
  const hpGem = hpWaarden.reduce((s,v)=>s+v,0)/hpWaarden.length;
  const hpStddev = Math.sqrt(hpWaarden.reduce((s,v)=>s+Math.pow(v-hpGem,2),0)/hpWaarden.length);
  const consistentie = Math.max(0, Math.min(100, 100 - (hpStddev/hpGem)*200));

  // Controleer testomstandigheden
  const temps = geldig.map(ri=>ri.run.temperatuur).filter(v=>v!==''&&v!==null&&v!==undefined);
  const drukken = geldig.map(ri=>ri.run.luchtdruk).filter(v=>v!==''&&v!==null&&v!==undefined);
  let condWarning = null;
  if(geldig.length>1&&temps.length>1){
    const tempRange = Math.max(...temps)-Math.min(...temps);
    const drukRange = drukken.length>1 ? Math.max(...drukken)-Math.min(...drukken) : 0;
    if(tempRange>5||drukRange>20)
      condWarning=`Temperatuurverschil ${tempRange.toFixed(0)}°C${drukRange>20?`, luchtdrukverschil ${drukRange.toFixed(0)} mbar`:''}. Vergelijking minder betrouwbaar.`;
  }

  return {
    beste: {run:beste.run, sessie:beste.sessie, analyse:besteAnalyse},
    aantalRuns: geldig.length,
    gemAnalyse, consistentie, condWarning
  };
}

// ── SCORING ───────────────────────────────────────────────────────────────────
function berekenAlleScores(){
  // Verzamel alle combinatie-analyses
  const items = [];
  Object.entries(combinaties).forEach(([mn,carbuMap])=>{
    Object.entries(carbuMap).forEach(([carbu,runItems])=>{
      const combi = analyseCombi(runItems);
      if(combi) items.push({mn, carbu, combi, analyse:combi.gemAnalyse});
    });
  });
  if(!items.length){alleScores=null;return;}

  // Bepaal maxima voor normalisatie
  const max = {
    peakHp: Math.max(...items.map(x=>x.analyse.peakHp||0))||1,
    gemHpMidden: Math.max(...items.map(x=>x.analyse.gemHpMidden||0))||1,
    gemHpTop: Math.max(...items.map(x=>x.analyse.gemHpTop||0))||1,
    gemNmMidden: Math.max(...items.map(x=>x.analyse.gemNmMidden||0))||1,
    powerbandBreedte: Math.max(...items.map(x=>x.analyse.powerbandBreedte||0))||1,
    curveKwaliteit: 1.0
  };

  // Bereken score per item
  alleScores = {};
  items.forEach(({mn,carbu,combi,analyse})=>{
    const w = ANALYSE_GEWICHTEN;
    const n = (v,m)=>Math.min(100,(v||0)/m*100);

    const components = {
      peakVermogen:     n(analyse.peakHp, max.peakHp),
      middengebied:     n(analyse.gemHpMidden||0, max.gemHpMidden),
      bovengebied:      n(analyse.gemHpTop||0, max.gemHpTop),
      koppel:           n(analyse.gemNmMidden||0, max.gemNmMidden),
      powerbandBreedte: n(analyse.powerbandBreedte||0, max.powerbandBreedte),
      curveKwaliteit:   n(analyse.curveKwaliteit||0, max.curveKwaliteit)
    };

    const totaal =
      components.peakVermogen     * w.peakVermogen +
      components.middengebied     * w.middengebied +
      components.bovengebied      * w.bovengebied +
      components.koppel           * w.koppel +
      components.powerbandBreedte * w.powerbandBreedte +
      components.curveKwaliteit   * w.curveKwaliteit;

    if(!alleScores[mn]) alleScores[mn]={};
    alleScores[mn][carbu]={components, totaal, combi};
  });
}

function getScore(mn, carbu){
  return alleScores?.[mn]?.[carbu] || null;
}

// ── TEKST GENERATIE ───────────────────────────────────────────────────────────
function genereerTekst(analyse, score){
  if(!analyse||!score) return '';
  const {peakHp, peakHpRpm, peakNm, peakNmRpm, gemHpMidden, gemHpTop, powerbandBreedte, curveKwaliteit} = analyse;
  const {components} = score;
  const zinnen = [];

  // Piekvermogen
  const piekWoord = peakHp>=29.5?'uitstekende':peakHp>=28.5?'sterke':peakHp>=27.5?'goede':'redelijke';
  zinnen.push(`Deze carburateur levert een ${piekWoord} piek van ${f1(peakHp)} HP bij ${fRpm(peakHpRpm)} rpm.`);

  // Koppel
  if(peakNm){
    const nmWoord = peakNm>=19.5?'uitstekend':peakNm>=18.5?'sterk':peakNm>=17.5?'goed':'redelijk';
    zinnen.push(`Het koppel is ${nmWoord}: ${f2(peakNm)} Nm bij ${fRpm(peakNmRpm)} rpm.`);
  }

  // Middengebied
  if(gemHpMidden){
    const verhouding = gemHpMidden / peakHp;
    if(verhouding>=0.96)
      zinnen.push('Het vermogen in het middengebied (9.000–11.500 rpm) is bijzonder sterk en blijft vrijwel op het niveau van de piek.');
    else if(verhouding>=0.90)
      zinnen.push(`Het middengebied (9.000–11.500 rpm) is goed met gemiddeld ${f1(gemHpMidden)} HP — dit zorgt voor een brede, bruikbare curve.`);
    else
      zinnen.push(`Het middengebied (9.000–11.500 rpm) gemiddeld ${f1(gemHpMidden)} HP valt wat terug ten opzichte van de piek.`);
  }

  // Bovengebied
  if(gemHpTop){
    const topVerh = gemHpTop / peakHp;
    if(topVerh>=0.90)
      zinnen.push('Het vermogen in het bovengebied (boven 11.500 rpm) blijft sterk na de piek.');
    else if(topVerh>=0.80)
      zinnen.push('Na de piek daalt het vermogen gematigd in het bovengebied.');
    else
      zinnen.push('Het vermogen daalt duidelijk na de piek in het bovengebied.');
  }

  // Powerbandbreedgte
  if(powerbandBreedte>=2500)
    zinnen.push(`De vermogenscurve is breed: het toerentalgebied met minimaal 95% van het piekvermogen bedraagt ${fRpm(powerbandBreedte)} rpm.`);
  else if(powerbandBreedte>=1500)
    zinnen.push(`De breedte van de vermogenscurve (≥95% van piek) is ${fRpm(powerbandBreedte)} rpm — bruikbaar over een ruim toerentalgebied.`);
  else if(powerbandBreedte>0)
    zinnen.push(`De piek is relatief smal (${fRpm(powerbandBreedte)} rpm op ≥95% niveau).`);

  // Curve kwaliteit
  if(curveKwaliteit>=0.85)
    zinnen.push('De curve is vloeiend en consistent zonder opvallende onregelmatigheden.');
  else if(curveKwaliteit<0.60)
    zinnen.push('De curve vertoont enige onregelmatigheden — meerdere meetpunten kunnen de betrouwbaarheid verbeteren.');

  // Totaaloordeel
  const tot = score.totaal;
  if(tot>=92)
    zinnen.push('Totaaloordeel: uitstekende allround prestaties over het volledige toerentalgebied.');
  else if(tot>=85)
    zinnen.push('Totaaloordeel: sterke combinatie met goede balans tussen piek, middengebied en koppel.');
  else if(tot>=75)
    zinnen.push('Totaaloordeel: degelijke combinatie, maar er is ruimte voor verbetering.');
  else
    zinnen.push('Totaaloordeel: beperkte prestaties — overweeg alternatieve carburatoren voor deze motor.');

  return zinnen.join(' ');
}

// ── OPTIMALISATIE (greedy Hungarian) ─────────────────────────────────────────
function berekenOptimaleVerdeling(){
  const motorNrs = Object.keys(combinaties);
  const carbuSet = new Set();
  motorNrs.forEach(mn=>Object.keys(combinaties[mn]).forEach(c=>carbuSet.add(c)));
  const carbus = [...carbuSet];

  // Bouw score matrix
  const matrix = motorNrs.map(mn=>
    carbus.map(cb=>getScore(mn,cb)?.totaal||0)
  );

  // Greedy: sorteer alle (motor, carbu, score) op score desc, pak steeds de beste niet-gebruikte
  const opties = [];
  motorNrs.forEach((mn,i)=>{
    carbus.forEach((cb,j)=>{
      const score = matrix[i][j];
      if(score>0) opties.push({mn,cb,score,i,j});
    });
  });
  opties.sort((a,b)=>b.score-a.score);

  const toegewezen = new Map();
  const gebruiktCarbu = new Set();
  opties.forEach(opt=>{
    if(!toegewezen.has(opt.mn)&&!gebruiktCarbu.has(opt.cb)){
      toegewezen.set(opt.mn,opt.cb);
      gebruiktCarbu.add(opt.cb);
    }
  });

  // Motoren zonder toewijzing (niet voldoende data)
  motorNrs.forEach(mn=>{
    if(!toegewezen.has(mn)) toegewezen.set(mn,null);
  });

  return motorNrs.map(mn=>({
    motorNr: mn,
    carbu: toegewezen.get(mn)||null,
    score: toegewezen.get(mn) ? (getScore(mn,toegewezen.get(mn))?.totaal||0) : 0
  })).sort((a,b)=>b.score-a.score);
}

// ── CHART ─────────────────────────────────────────────────────────────────────
function tekenChart(canvasId, series, modus='hp'){
  if(chartInstantie){chartInstantie.destroy();chartInstantie=null;}
  const canvas = document.getElementById(canvasId);
  if(!canvas) return;

  const datasets = series.map((s,i)=>{
    const curve = normaliseerCurve(s.curve||[]);
    return {
      label: s.label,
      data: curve.map(p=>({x:p.rpm,y:modus==='hp'?p.hp:p.nm})),
      borderColor: s.kleur||KLEUREN[i%KLEUREN.length],
      backgroundColor: 'transparent',
      borderWidth: 2.5,
      pointRadius: 0,
      tension: 0.3
    };
  });

  chartInstantie = new Chart(canvas, {
    type:'line',
    data:{datasets},
    options:{
      responsive:true, maintainAspectRatio:false,
      interaction:{mode:'index',intersect:false},
      scales:{
        x:{type:'linear',title:{display:true,text:'RPM',font:{size:11}},ticks:{font:{size:10}}},
        y:{title:{display:true,text:modus==='hp'?'HP':'Nm',font:{size:11}},ticks:{font:{size:10}}}
      },
      plugins:{legend:{position:'top',labels:{font:{size:11},boxWidth:12}},tooltip:{callbacks:{
        label:ctx=>`${ctx.dataset.label}: ${ctx.parsed.y?.toFixed(2)} ${modus==='hp'?'HP':'Nm'}`
      }}}
    }
  });
}

function renderOverzicht(){
  const motorNrs = Object.keys(combinaties);
  const carbuSet = new Set();
  motorNrs.forEach(mn=>Object.keys(combinaties[mn]).forEach(c=>carbuSet.add(c)));
  const aantalRuns = motorNrs.reduce((s,mn)=>
    s+Object.values(combinaties[mn]).reduce((s2,ri)=>s2+ri.length,0),0);

  let besteMn='', besteCarbu='', besteScore=0;
  motorNrs.forEach(mn=>{
    Object.keys(combinaties[mn]).forEach(cb=>{
      const s = getScore(mn,cb);
      if(s&&s.totaal>besteScore){besteScore=s.totaal;besteMn=mn;besteCarbu=cb;}
    });
  });

  // Tabel alle combinaties
  const rijen = motorNrs.flatMap(mn=>
    Object.keys(combinaties[mn]).map(cb=>{
      const score = getScore(mn,cb);
      const combi = analyseCombi(combinaties[mn][cb]);
      const beste = combi?.beste?.analyse;
      return {mn,cb,score,combi,beste};
    })
  ).sort((a,b)=>(b.score?.totaal||0)-(a.score?.totaal||0));

  const tblRijen = rijen.map(({mn,cb,score,combi,beste},idx)=>`
    <tr class="${idx===0?'hl':''}">
      <td><strong>${esc(motorLabel(mn))}</strong><br><span style="font-size:11px;color:#9ca3af">${esc(mn)}</span></td>
      <td>${esc(cb)}</td>
      <td>${beste?f1(beste.peakHp):'—'}</td>
      <td>${beste?fRpm(beste.peakHpRpm):'—'}</td>
      <td>${beste?f2(beste.peakNm):'—'}</td>
      <td>${combi?combi.aantalRuns:'0'}</td>
      <td>
        ${score?`<div class="score-bar-wrap"><div class="score-bar" style="min-width:70px"><div class="score-bar-fill" style="width:${Math.round(score.totaal)}%"></div></div><strong>${score.totaal.toFixed(1)}</strong></div>`:'—'}
      </td>
      <td><span class="chip-gemeten">🟢 Gemeten</span></td>
    </tr>`).join('');

  document.getElementById('main').innerHTML=`
    <div style="display:flex;align-items:center;gap:12px;margin-bottom:20px">
      <h1 class="page-title">Carbu Optimalisatie</h1>
    </div>
    ${subTabsHtml('overzicht')}
    <div class="stats-grid">
      <div class="stat-card"><div class="stat-val">${motorNrs.length}</div><div class="stat-lbl">Motoren</div></div>
      <div class="stat-card"><div class="stat-val">${carbuSet.size}</div><div class="stat-lbl">Carburatoren</div></div>
      <div class="stat-card"><div class="stat-val">${rijen.length}</div><div class="stat-lbl">Geteste combinaties</div></div>
      <div class="stat-card"><div class="stat-val">${aantalRuns}</div><div class="stat-lbl">Runs met curvedata</div></div>
      ${besteScore>0?`<div class="stat-card"><div class="stat-val" style="font-size:18px">${esc(motorLabel(besteMn))}</div><div class="stat-lbl">Beste: ${esc(besteCarbu)} (${besteScore.toFixed(1)})</div></div>`:''}
    </div>
    <div class="card">
      <div class="card-title">Alle geteste combinaties</div>
      <div class="tbl-scroll">
        <table class="tbl tbl-border">
          <thead><tr>
            <th>Motor</th><th>Carburateur</th><th>Max HP</th><th>RPM HP</th><th>Max Nm</th><th>Runs</th><th>Score</th><th>Status</th>
          </tr></thead>
          <tbody>${tblRijen||'<tr><td colspan="8" style="text-align:center;padding:24px;color:#9ca3af">Geen data met curvedata gevonden</td></tr>'}</tbody>
        </table>
      </div>
    </div>
    ${renderAlleCarburatoren()}`;
}

let huidigChartModus = 'hp';
function wisselModus(m){
  huidigChartModus = m;
  const mn = gekozenMotor || Object.keys(combinaties)[0];
  const carbuMap = combinaties[mn]||{};
  const carbuLijst = Object.keys(carbuMap).sort((a,b)=>{
    const sa=getScore(mn,a)?.totaal||0, sb=getScore(mn,b)?.totaal||0;
    return sb-sa;
  });
  const series = carbuLijst.slice(0,5).map((cb,i)=>{
    const ri = besteRunVan(carbuMap[cb]);
    return {label:cb, curve:ri?.run.curveData||[], kleur:KLEUREN[i%KLEUREN.length]};
  });
  tekenChart('motor-chart', series, m);
}

function toonBreakdown(mn, cb){
  const score = getScore(mn,cb);
  const combi = analyseCombi(combinaties[mn]?.[cb]||[]);
  const beste = combi?.beste?.analyse;
  const tekst = genereerTekst(beste, score);
  const el = document.getElementById('breakdown-detail');
  if(!el) return;
  el.innerHTML=`
    <div class="card">
      <div class="card-title">${esc(motorLabel(mn))} × ${esc(cb)} — Score breakdown</div>
      ${combi?.condWarning?`<div class="waarschuwing-tekst">⚠️ <div>Testomstandigheden varieerden: ${esc(combi.condWarning)}</div></div>`:''}
      ${renderBreakdown(score, beste)}
      ${tekst?`<div class="analyse-tekst">${esc(tekst)}</div>`:''}
    </div>`;
  el.scrollIntoView({behavior:'smooth', block:'nearest'});
}

    el.innerHTML='<div class="empty-state">Onvoldoende data voor optimalisatie.</div>';
    return;
  }

  const rijen = verdeling.map(({motorNr,carbu,score},idx)=>{
    if(!carbu){
      return `
        <div class="opt-rij" style="opacity:.5">
          <div class="opt-rang">${idx+1}</div>
          <div class="opt-motor">${esc(motorLabel(motorNr))}</div>
          <div class="opt-arrow">→</div>
          <div style="font-size:13px;color:#9ca3af">Geen passende carburateur beschikbaar</div>
        </div>`;
    }
    const scoreObj = getScore(motorNr,carbu);
    const combi = analyseCombi(combinaties[motorNr]?.[carbu]||[]);
    const beste = combi?.beste?.analyse;
    const tekst = genereerTekst(beste, scoreObj);
    const breakdown = renderBreakdown(scoreObj, beste);
    const uid = `opt-${idx}`;
    return `
      <div class="opt-rij" id="${uid}">
        <div class="opt-rang">${idx+1}</div>
        <div>
          <div class="opt-motor">${esc(motorLabel(motorNr))}</div>

        <div class="opt-arrow">→</div>
        <div class="opt-carbu">${esc(carbu)}</div>
        ${beste?`<span style="font-size:12px;color:#6b7280">${f1(beste.peakHp)} HP / ${f2(beste.peakNm)} Nm</span>`:''}
        <div class="opt-score">${score.toFixed(1)}</div>

  }).join('');

  el.innerHTML=`

      <div class="card-title">🏆 Resultaat optimale verdeling</div>
      ${rijen}
    </div>`;
}

function renderRanking(){
  // Alle combinaties gesorteerd op score
  const alle = [];
  Object.entries(combinaties).forEach(([mn,carbuMap])=>{
    Object.entries(carbuMap).forEach(([cb,runItems])=>{
      const score = getScore(mn,cb);
      const combi = analyseCombi(runItems);
      const beste = combi?.beste?.analyse;
      if(score) alle.push({mn,cb,score,combi,beste});
    });
  });
  alle.sort((a,b)=>b.score.totaal-a.score.totaal);

  // Per motor beste combinatie (elke motor één keer)
  const perMotor = new Map();
  alle.forEach(item=>{
    if(!perMotor.has(item.mn)) perMotor.set(item.mn, item);
  });
  const ranking = [...perMotor.values()].sort((a,b)=>b.score.totaal-a.score.totaal);

  // Carburateur prestaties over alle motoren
  const perCarbu = {};
  alle.forEach(item=>{
    if(!perCarbu[item.cb]) perCarbu[item.cb]={cb:item.cb, scores:[], hpWaarden:[]};
    perCarbu[item.cb].scores.push(item.score.totaal);
    if(item.beste?.peakHp) perCarbu[item.cb].hpWaarden.push(item.beste.peakHp);
  });
  const carbuRanking = Object.values(perCarbu).map(c=>({
    cb:c.cb,
    gemScore:c.scores.reduce((s,v)=>s+v,0)/c.scores.length,
    aantalMotoren:c.scores.length,
    gemHp:c.hpWaarden.length?c.hpWaarden.reduce((s,v)=>s+v,0)/c.hpWaarden.length:0
  })).sort((a,b)=>b.gemScore-a.gemScore);

  const rankRijen = ranking.map(({mn,cb,score,combi,beste},idx)=>`
    <tr class="${idx===0?'hl':''}">
      <td style="font-weight:800;color:#d1d5db">${idx+1}</td>
      <td><strong>${esc(motorLabel(mn))}</strong></td>
      <td>${esc(cb)}</td>
      <td>${beste?f1(beste.peakHp):'—'}</td>
      <td>${beste?f2(beste.peakNm):'—'}</td>
      <td>${beste?fRpm(beste.peakHpRpm):'—'}</td>
      <td><strong style="color:${idx===0?'#059669':'#111827'}">${score.totaal.toFixed(1)}</strong></td>
      <td><span class="chip-gemeten">🟢 Gemeten</span></td>
    </tr>`).join('');

  const carbuRijen = carbuRanking.map(({cb,gemScore,aantalMotoren,gemHp},idx)=>`
    <tr>
      <td style="font-weight:800;color:#d1d5db">${idx+1}</td>
      <td>${esc(cb)}</td>
      <td>${aantalMotoren}</td>
      <td>${gemHp>0?f1(gemHp):'—'}</td>
      <td><div class="score-bar-wrap"><div class="score-bar"><div class="score-bar-fill" style="width:${Math.round(gemScore)}%"></div></div><strong>${gemScore.toFixed(1)}</strong></div></td>
    </tr>`).join('');

  document.getElementById('main').innerHTML=`
    <h1 class="page-title" style="margin-bottom:20px">Carbu Optimalisatie</h1>
    ${subTabsHtml('ranking')}
    <div class="card">
      <div class="card-title">🏆 Beste motor/carburateur combinaties (beste per motor)</div>
      <div class="tbl-scroll">
        <table class="tbl tbl-border">
          <thead><tr><th>Rang</th><th>Motor</th><th>Carbu</th><th>Max HP</th><th>Max Nm</th><th>RPM HP</th><th>Score</th><th>Status</th></tr></thead>
          <tbody>${rankRijen||'<tr><td colspan="8" style="text-align:center;padding:24px;color:#9ca3af">Geen data</td></tr>'}</tbody>
        </table>
      </div>
    </div>
    <div class="card" style="margin-top:16px">
      <div class="card-title">Carburateuren ranking (gemiddeld over alle geteste motoren)</div>
      <div class="tbl-scroll">
        <table class="tbl tbl-border">
          <thead><tr><th>Rang</th><th>Carburateur</th><th>Motoren</th><th>Gem. HP</th><th>Gem. Score</th></tr></thead>
          <tbody>${carbuRijen||'<tr><td colspan="5" style="text-align:center;padding:24px;color:#9ca3af">Geen data</td></tr>'}</tbody>
        </table>
      </div>
    </div>`;
}

function render(){
  if(huidigView==='overzicht') renderOverzicht();
  else if(huidigView==='motor') renderMotorAnalyse();
  else if(huidigView==='carburateur') renderCarburateurAnalyse();
  else if(huidigView==='optimalisatie') renderOptimalisatie();
  else if(huidigView==='ranking') renderRanking();
}

function gaaNaar(view){
  huidigView = view;
  if(chartInstantie){chartInstantie.destroy();chartInstantie=null;}
  render();
  window.scrollTo(0,0);
}

// ── AUTH + INIT ───────────────────────────────────────────────────────────────
async function init(){
  try{sb=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);}catch(e){sb=null;}
  if(!sb){window.location.href='/';return;}
  const{data:{session}}=await sb.auth.getSession();
  if(!session){
    document.getElementById('login-screen').classList.add('active');
    return;
  }
  const {data:rd}=await sb.from('user_roles').select('rol').eq('user_email',session.user.email);
  const rol=new Set((rd||[]).map(r=>r.rol));
  if(!rol.has('dfk-engines')&&!rol.has('admin')){
    window.location.href=rol.has('dfk-logistics')?'/dfk-logistics/':'/';return;
  }
  sb.from('profiles').select('naam').eq('email',session.user.email).single().then(({data:p})=>{
    const el=document.getElementById('header-naam');
    if(el) el.textContent=p?.naam||session.user.email.split('@')[0];
  });
  if(rol.has('admin')){
    document.getElementById('nav-materiaal').style.display='';
  }
  if(rol.has('admin')||rol.has('dfk-sales')){
    document.getElementById('nav-sales-wrap').style.display='';
  }
  await laadData();
}
init();
</script>
</body>
</html>
